<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>HMMMM · Revisión editorial</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111a;color:#eaf3f9;font:15px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px 16px}h1{font-size:clamp(28px,5vw,44px);margin:8px 0;color:#58e4ed}h2{font-size:20px;margin:0}p{margin:8px 0}a{color:#58e4ed;overflow-wrap:anywhere}small,.muted{color:#a2b4c4}section,article{background:#101e2b;border:1px solid #263849;border-radius:10px;padding:16px;margin:12px 0;overflow-wrap:anywhere}label{display:block;margin:8px 0}input,button,select{max-width:100%;font:inherit;color:inherit;background:#122331;border:1px solid #385064;border-radius:7px;padding:8px}button,select{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #58e4ed;outline-offset:2px}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.meta{color:#a2b4c4;font-size:13px}.status{color:#f6c66e}
</style></head><body><main>
<a href="index.html">Volver al radar publicado</a><h1>Revisión editorial</h1><p>Los candidatos son propuestas, no incidentes verificados. Las decisiones se exportan como JSON y nunca publican ni cambian el radar.</p>
<section><label for="queue">Importar cola JSON de review-kev o review-disclosures</label><input type="file" id="queue" accept=".json,application/json"><p class="muted">Una cola a la vez. Exporta las decisiones antes de abrir otra cola o cerrar la página.</p><p id="notice" role="status"></p></section>
<div class="tools"><label for="filter">Estado</label><select id="filter"><option value="all">Todos</option><option value="pending">Pendientes</option><option value="investigate">Investigar</option><option value="covered">Ya cubierto</option><option value="dismiss">Descartar</option></select><button id="export" disabled>Exportar decisiones</button></div>
<p id="counts" role="status">Sin cola cargada.</p><div id="cards"></div>
</main><script src="lib/workbench.js"></script><script src="lib/workbench-ui.js"></script></body></html>
