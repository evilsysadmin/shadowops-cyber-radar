name: Weekly candidate collection
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 5'
  pull_request:
    paths:
      - '.github/workflows/weekly-candidates.yml'
      - 'scripts/live-review.cjs'
permissions:
  contents: read
concurrency:
  group: radar-weekly-candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Collect and validate unpublished candidates
        shell: bash
        run: |
          set -euo pipefail
          from="$(date -u -d '6 days ago' +%F)"
          through="$(date -u +%F)"
          node scripts/live-review.cjs "$from" "$through" > "$RUNNER_TEMP/radar-review.json"
          node -e 'const q=require("./lib/workbench.js").normalizeBatch(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"))); console.log("Unpublished review candidates:",q.candidates.length)' "$RUNNER_TEMP/radar-review.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unpublished review queue
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-unpublished-review-queue
          path: ${{ runner.temp }}/radar-review.json
          if-no-files-found: error
          retention-days: 7
