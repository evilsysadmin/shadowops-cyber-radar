name: Radar CI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'review.html'
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/build-static.cjs dist
