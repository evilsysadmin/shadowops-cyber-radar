name: Radar CI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'radar.css'
      - '_headers'
      - 'review.html'
      - 'data/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'radar.css'
      - '_headers'
      - 'data/editions.js'
      - 'lib/**'
      - 'scripts/build-static.cjs'
      - 'scripts/release-candidate.cjs'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tests/*.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node scripts/build-static.cjs dist
      - run: node tests/browser-smoke.cjs
      - name: Build and verify immutable release candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-candidate.cjs build "$RUNNER_TEMP/radar-release" "$GITHUB_SHA"
          node scripts/release-candidate.cjs verify "$RUNNER_TEMP/radar-release" "$GITHUB_SHA"
      - name: Upload verified static candidate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: radar-static-${{ github.sha }}
          path: ${{ runner.temp }}/radar-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
